name: Yasir Grade Portal - Security Preflight
on:
  push:
    paths:
      - "grades/**"
      - ".github/workflows/yasir-preflight.yml"
  pull_request:
    paths:
      - "grades/**"
      - ".github/workflows/yasir-preflight.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: node --check grades/backend/functions/index.js
      - name: Test authorization policies
        run: node --test grades/backend/functions/policy.test.mjs
      - name: Check secure client syntax
        run: node --check grades/secure/app.js
      - name: Check production safety boundaries
        run: node --test grades/secure/preflight.test.mjs
      - name: Check Spark client syntax
        run: node --check grades/spark/app.js
      - name: Check free-plan safety boundaries
        run: node --test grades/spark/preflight.test.mjs
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Firestore test dependencies
        working-directory: grades/spark
        run: npm install --no-audit --no-fund --no-save firebase@13.2.0 @firebase/rules-unit-testing@6.0.0
      - name: Test Firestore security rules in emulator
        working-directory: grades/spark
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-yasir-rules-tests --config firebase.json "node --test rules.test.mjs"
