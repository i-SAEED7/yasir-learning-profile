name: Yasir Grades - Deploy Firebase Backend
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: yasir-firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy verified functions and Firestore rules
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify workload identity is configured
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.FIREBASE_DEPLOYER_SA }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set repository variable FIREBASE_WIF_PROVIDER"; exit 1; }
          test -n "$DEPLOYER_SA" || { echo "::error::Set repository variable FIREBASE_DEPLOYER_SA"; exit 1; }
      - name: Authenticate Google Cloud without a static key
        uses: google-github-actions/auth@v3
        with:
          project_id: yasir-learning-profile
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOYER_SA }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend syntax
        run: node --check grades/backend/functions/index.js
      - name: Run authorization policy tests
        run: node --test grades/backend/functions/policy.test.mjs
      - name: Install backend dependencies
        working-directory: grades/backend/functions
        run: npm install --no-audit --no-fund
      - name: Deploy functions and database rules
        working-directory: grades/backend
        run: npx --yes firebase-tools@15.35.0 deploy --only "functions:yasir-grades,firestore:rules" --project yasir-learning-profile --non-interactive
